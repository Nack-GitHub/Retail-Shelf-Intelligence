[project]
name = "shelfeye-contracts"
version = "1.0.0"
description = "The ONLY coupling point between shelfeye-api and shelfeye-ml."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shelfeye_contracts"]
