[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the framework's idiom
    "E501",  # long lines are caught by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # conftest sets env vars before importing the app

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
